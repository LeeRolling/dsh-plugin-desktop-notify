# dsh-plugin-desktop-notify bundle patch layer.
#
# Contributes one host row for this package. The host half is an empty Cordis
# plugin: it exists so the Loader has an entry to scan. client-modules finds the
# same entry, sees `dsh.client` + the `./client` export, and injects the browser
# half (the notification watcher) into the client boot graph.
- insert:
    - id: plugin-desktop-notify
      name: 'dsh-plugin-desktop-notify'
